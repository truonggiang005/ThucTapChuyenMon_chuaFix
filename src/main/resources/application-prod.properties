# ==========================================
# Profile PRODUCTION  (SPRING_PROFILES_ACTIVE=prod)
# ==========================================
# Bắt buộc đặt biến môi trường: DB_URL, DB_USER, DB_PASSWORD, AI_INTERNAL_KEY (không có giá trị mặc định → thiếu là báo lỗi).
# DB_URL nên bật SSL, ví dụ:
#   jdbc:mysql://db-host:3306/smart_schedule?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
ai.service.internal-key=${AI_INTERNAL_KEY}

# Schema không tự thay đổi khi chạy thật: tạo/migrate bằng script (khuyến nghị Flyway) rồi validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Không seed dữ liệu mẫu / không tạo tài khoản mật khẩu mẫu
app.seed.enabled=false

# Cookie phiên chỉ gửi qua HTTPS (đặt app sau HTTPS/reverse proxy)
server.servlet.session.cookie.secure=true

spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600

logging.level.com.smartschedule=INFO
