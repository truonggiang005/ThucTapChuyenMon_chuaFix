# ==========================================
# Profile DEVELOPMENT  (SPRING_PROFILES_ACTIVE=dev; `mvn spring-boot:run` tự bật)
# ==========================================
# CHỈ dành cho máy phát triển. KHÔNG dùng cho môi trường thật.

# MySQL cục bộ (ghi đè bằng DB_URL/DB_USER/DB_PASSWORD nếu cần)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_schedule?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Phát triển: Hibernate tự tạo/cập nhật bảng (thay cho schema.sql)
spring.jpa.hibernate.ddl-auto=update

# Dữ liệu mẫu + mật khẩu mẫu (được băm BCrypt). Đủ 8 ký tự, có chữ và số theo PasswordPolicy.
app.seed.enabled=true
app.seed.password=Smart1234

# Khóa nội bộ Spring <-> AI service: giá trị mặc định cho dev để không bị lỗi "AI hỏng" vì quên cấu hình (C5).
# Phía Python đặt cùng giá trị: INTERNAL_KEY=dev-internal-key-change-me (xem .env.example)
ai.service.internal-key=${AI_INTERNAL_KEY:Giangkey}

# HTTP thường trên localhost nên cookie không đặt secure
server.servlet.session.cookie.secure=false

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

logging.level.com.smartschedule=DEBUG
