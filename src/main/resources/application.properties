# ==========================================
# SmartSchedule - Application Configuration
# ==========================================
# Thông tin nhạy cảm lấy từ BIẾN MÔI TRƯỜNG, không viết cứng (SEC-13).
# Chạy thật: SPRING_PROFILES_ACTIVE=prod (xem application-prod.properties).

# Server
server.port=8080

# Phiên đăng nhập: cookie HttpOnly, không gửi kèm request từ site khác (secure=true đặt ở profile prod)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# MySQL Database (mặc định cho máy phát triển; đặt DB_URL/DB_USER/DB_PASSWORD để ghi đè)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_schedule?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (phát triển: tự cập nhật schema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AI Microservice (Python FastAPI): chỉ Spring gọi, kèm khóa bí mật dùng chung
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}
ai.service.internal-key=${AI_INTERNAL_KEY:}
# Giới hạn số lần gọi AI / người / phút (chống đốt quota)
ai.rate-limit.per-minute=60

# Scheduling (enable @Scheduled); app.scheduler.enabled=false trên các instance phụ
spring.task.scheduling.pool.size=5
app.scheduler.enabled=true

# Quy định nghiệp vụ: phải nhả ca trước giờ bắt đầu ít nhất N giờ
app.shift.min-release-hours=2

# Dữ liệu mẫu (chỉ để phát triển; TẮT ở prod). Mật khẩu mẫu được băm BCrypt.
app.seed.enabled=true
app.seed.password=123456

# Thymeleaf Cache (tắt để thấy thay đổi khi phát triển)
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Logging
logging.level.com.smartschedule=INFO
