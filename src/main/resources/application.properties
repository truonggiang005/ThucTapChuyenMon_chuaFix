# ==========================================
# SmartSchedule - Cấu hình CHUNG (an toàn theo mặc định)
# ==========================================
# File này KHÔNG chứa mật khẩu, tài khoản mẫu hay giá trị dành riêng cho máy phát triển.
# Mọi thứ nguy hiểm nếu quên đổi (seed, mật khẩu mẫu, DB root rỗng mật khẩu, ddl-auto=update...)
# đã được chuyển sang application-dev.properties và chỉ bật khi chủ động chọn profile "dev".
#
#   Phát triển:   SPRING_PROFILES_ACTIVE=dev   (mvn spring-boot:run đã tự bật "dev")
#   Chạy thật:    SPRING_PROFILES_ACTIVE=prod  (xem application-prod.properties)
#
# Không chọn profile nào => ứng dụng KHÔNG khởi động vì thiếu DB_URL/DB_USER/DB_PASSWORD
# (thà báo lỗi rõ ràng còn hơn chạy với cấu hình dev trên môi trường thật).

server.port=8080
# Chạy sau reverse proxy (nginx/Traefik/Cloud LB): lấy IP thật từ X-Forwarded-For (cần cho giới hạn đăng nhập)
server.forward-headers-strategy=native

# Phiên đăng nhập: cookie HttpOnly, không gửi kèm request từ site khác (secure=true đặt ở profile prod)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# ---- Cơ sở dữ liệu: KHÔNG có giá trị mặc định ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate: schema do script (src/main/resources/db/schema.sql) tạo, Hibernate chỉ kiểm tra ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Múi giờ nghiệp vụ (ca làm, tuần làm việc, lịch bận đều tính theo múi giờ này) ----
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
spring.jpa.properties.hibernate.jdbc.time_zone=${app.timezone}

# ---- AI Microservice (Python FastAPI): chỉ Spring gọi, kèm khóa bí mật dùng chung ----
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}
ai.service.internal-key=${AI_INTERNAL_KEY:}
ai.service.connect-timeout-seconds=3
ai.service.read-timeout-seconds=15
# Giới hạn số lần gọi AI / người / phút (chống đốt quota). "market" là lượt chấm điểm Chợ ca (đã gộp 1 lần gọi/trang).
ai.rate-limit.per-minute=60
ai.rate-limit.market-per-minute=30

# ---- Tác vụ định kỳ (tự gán ca, đánh dấu hoàn thành/quá hạn). Tắt ở các instance phụ ----
spring.task.scheduling.pool.size=5
app.scheduler.enabled=true
app.scheduler.fixed-rate-ms=300000
# Chỉ tự gán các ca sẽ bắt đầu trong N giờ tới
app.scheduler.auto-assign-window-hours=2
app.scheduler.max-shifts-per-run=20
# Gemini hết quota/lỗi: vẫn tự gán theo điểm công thức dự phòng (30% tin cậy, 25% kỹ năng, 20% khung giờ, 15% khối lượng, 10% chi nhánh).
# Đặt false nếu chỉ muốn tự gán khi điểm do Gemini chấm.
app.scheduler.allow-formula-fallback=true
# Khóa trong DB để chỉ 1 instance chạy job tại một thời điểm (hết hạn sau N phút nếu instance chết)
app.scheduler.lock-minutes=10

# ---- Quy định nghiệp vụ ----
# Phải nhả ca trước giờ bắt đầu ít nhất N giờ
app.shift.min-release-hours=2
# Độ dài ca hợp lệ: tối thiểu N phút, tối đa N giờ
app.shift.min-minutes=15
app.shift.max-hours=24
# true: nhân viên chỉ được nhận ca ở chi nhánh chính của mình
app.shift.restrict-to-primary-branch=false
# Lịch bận tối đa N ngày liên tiếp cho 1 lần đăng ký
app.busy.max-days=14

# ---- Bảo mật tài khoản ----
app.security.max-failed-logins=5
app.security.lock-minutes=15
app.security.max-sessions=3
app.security.login-per-ip-per-minute=30
app.security.login-per-account-per-minute=5

# ---- Thông báo trong ứng dụng ----
app.notifications.retention-days=30

# ---- Dữ liệu mẫu: mặc định TẮT (chỉ profile dev mới bật) ----
app.seed.enabled=false

# ---- Quản trị viên đầu tiên khi chạy thật (chỉ tạo nếu CHƯA có ADMIN nào) ----
# Đặt đủ 3 biến môi trường này ở lần chạy đầu tiên; sau đó có thể bỏ đi.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Quản trị viên}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

logging.level.com.smartschedule=INFO
