# ==========================================
# SmartSchedule - Application Configuration
# ==========================================

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/smart_schedule?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AI Microservice URL (Python FastAPI)
ai.service.url=http://localhost:8000

# Scheduling (enable @Scheduled)
spring.task.scheduling.pool.size=5

# Logging
logging.level.com.smartschedule=DEBUG
logging.level.org.hibernate.SQL=DEBUG
